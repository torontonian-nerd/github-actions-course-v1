name: Runners Demo
on: workflow_dispatch # Change to push when running workflow
jobs:
    job-1-linux-runner:
        runs-on: ubuntu-latest
        steps:
            - name: Show OS
              # RUNNER_OS is an env varibale 
              run: |
                echo "This job is running on an Ubuntu runner"
                echo "Runner OS: $RUNNER_OS"
    job-2-windows-runner:
        runs-on: windows-latest
        steps:
            - name: Show OS
              shell: bash
              run: |
                echo "This job is running on a Windows runner."
                echo "Runner OS: $RUNNER_OS"