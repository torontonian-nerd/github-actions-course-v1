name: Contexts with ENV
on: push
env:
    VARIABLE_1: 'value of variable_1'
    VARIABLE_2: 'value of variable_2'
jobs:
  echo-data:
    runs-on: ubuntu-latest
    env:
        MY_ROLE_NUMBER: 007
        MY_NAME: 'rahul'
    steps:
      - name: Display information
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
      - name: Retrieve value of variable
        run: |
          echo "Variable value is : ${{ vars.MY_VAR }}"
      - name: Print job defined Env variables
        run: |
          echo "${{ env.MY_NAME}}"
          echo "${{env.MY_ROLE_NUMBER}}"
          echo "${{env.VARIABLE_1}}"
          echo "${{env.VARIABLE_2}}"
  print-env-job:
    runs-on: ubuntu-latest
    steps:
        - name: Print Env Variables
          run: |
            echo "The : $VARIABLE_1"
            echo "The : $VARIABLE_2"