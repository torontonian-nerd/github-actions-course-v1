name: Actions Demo

on: workflow_dispatch # Initial value is push, updated to not accidently run when pushing to github

jobs:
    build-job-1:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Printing folders
              run: ls # Print directories under parent folder
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: '20.x'
            - name: Install dependencies
              run: npm ci # Run in react-app dir
            - name: Run unit tests
              run: npm run test -- --run